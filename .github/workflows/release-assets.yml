# Attaches self-contained Avalonia builds to every GitHub release: linux-x64
# (issue #4) and, since quasarj's macOS support landed in #90 and brucealeg asked
# for a downloadable build in discussion #93, osx-arm64 + osx-x64. The Avalonia
# UI may trail the Windows app by a few releases — see the release notes and
# issue tracker for its current parity level.
#
# macOS ships as a proper EQBuddy.app bundle in a .zip (discussion #157, pmcginn:
# the old tarball was loose files with nothing obviously openable). Linux stays a
# .tar.gz.
#
# The macOS builds are unsigned (no Apple developer account): first launch needs
# right-click → Open, or `xattr -dr com.apple.quarantine EQBuddy.app` — the
# README's macOS section says the same.
name: Release assets

on:
  release:
    types: [published]

# Default deny; only the publish job needs to write (uploading release assets).
permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write   # gh release upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish Avalonia ${{ matrix.rid }} (self-contained)
        run: >
          dotnet publish src/EQBuddy.Avalonia/EQBuddy.Avalonia.csproj -c Release
          -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true
          -o publish-out

      - name: Package (Linux tarball)
        if: startsWith(matrix.rid, 'linux')
        run: |
          cp README.md docs/FeatureGuide.md publish-out/
          tar -czf EQBuddy-${{ matrix.rid }}.tar.gz -C publish-out .

      # macOS gets a real .app bundle rather than loose files. pmcginn (discussion
      # #157) extracted the tarball as a new Mac user and had nothing obviously
      # openable: the executable has no extension, so Finder treats it as a document
      # and asks which program to open it with. A bundle is just a structured folder
      # that macOS knows how to launch, and it costs us this step.
      #
      # Everything from publish-out goes into Contents/MacOS, not only the executable:
      # PublishSingleFile still leaves the native Skia/HarfBuzz libraries beside it,
      # and an app bundle missing those launches to nothing.
      - name: Package (macOS .app bundle)
        if: startsWith(matrix.rid, 'osx')
        run: |
          set -euo pipefail
          APP="EQBuddy.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish-out/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/EQBuddy.Avalonia"

          # The bundle is named EQBuddy for the user; the executable keeps its published
          # name, because the single-file host locates its own bundle by that path.
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>EQBuddy</string>
            <key>CFBundleDisplayName</key><string>EQBuddy</string>
            <key>CFBundleIdentifier</key><string>com.dranakcorps.eqbuddy</string>
            <key>CFBundleExecutable</key><string>EQBuddy.Avalonia</string>
            <key>CFBundleIconFile</key><string>EQBuddy</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
          </dict>
          </plist>
          PLIST
          # Version comes from the tag rather than being hardcoded in the plist above.
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$APP/Contents/Info.plist"

          # Icon: best effort. A bundle with a generic icon still launches, so a
          # conversion failure must not fail the release.
          if sips -s format png src/EQBuddy/Assets/EQBuddy.ico --out /tmp/icon.png >/dev/null 2>&1; then
            mkdir -p /tmp/EQBuddy.iconset
            for size in 16 32 64 128 256 512; do
              sips -z $size $size /tmp/icon.png --out "/tmp/EQBuddy.iconset/icon_${size}x${size}.png" >/dev/null 2>&1 || true
            done
            iconutil -c icns /tmp/EQBuddy.iconset -o "$APP/Contents/Resources/EQBuddy.icns" 2>/dev/null \
              || echo "icon conversion failed - shipping without a custom icon"
          else
            echo "sips could not read the .ico - shipping without a custom icon"
          fi

          mkdir -p stage
          cp -R "$APP" stage/
          cp README.md docs/FeatureGuide.md stage/
          # ditto, not zip: it preserves the bundle so Finder expands it back into an
          # app rather than a folder of parts.
          ditto -c -k --sequesterRsrc --keepParent stage "EQBuddy-${{ matrix.rid }}.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ startsWith(matrix.rid, 'osx') }}" = "true" ]; then
            asset="EQBuddy-${{ matrix.rid }}.zip"
          else
            asset="EQBuddy-${{ matrix.rid }}.tar.gz"
          fi
          gh release upload "${{ github.event.release.tag_name }}" "$asset" --clobber
